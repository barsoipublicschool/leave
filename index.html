<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Application | Barsoi Public School</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary: #0f172a;
      --secondary: #2563eb;
      --secondary-hover: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .main-wrapper {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .school-header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      text-align: center;
      padding: 26px 20px;
    }
    .school-header h1 { font-size: 18px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
    .school-header p { font-size: 12px; opacity: 0.85; font-weight: 500; }
    .content-body { padding: 24px; }
    .portal-title { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    
    .form-group { display: flex; flex-direction: column; margin-bottom: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    label { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    input, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      background: #f8fafc;
      font-weight: 600;
      color: var(--text-main);
      transition: all 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--secondary); background: #fff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    textarea { resize: none; height: 80px; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-submit:hover { background: var(--secondary-hover); }

    .btn-check {
      background: #0f172a;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-check:hover { background: #1e293b; }

    .footer-note { text-align: center; font-size: 11px; color: var(--text-muted); padding: 14px; border-top: 1px solid var(--border-color); background: #f8fafc; }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="school-header">
    <h1>Barsoi Public School</h1>
    <p>Student Leave Application Portal</p>
  </div>

  <div class="content-body">
    <div class="portal-title">
      <span>Apply for Leave</span>
      <button class="btn-check" onclick="checkLeaveStatus()">Check Status</button>
    </div>
    
    <div class="form-grid">
      <div class="form-group">
        <label>Class Name</label>
        <input type="text" id="className" placeholder="e.g. 8th">
      </div>
      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" id="rollNo" placeholder="e.g. 24">
      </div>
    </div>

    <div class="form-group">
      <label>Student Name</label>
      <input type="text" id="studentName" placeholder="Full Name">
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>From Date</label>
        <input type="date" id="fromDate">
      </div>
      <div class="form-group">
        <label>To Date</label>
        <input type="date" id="toDate">
      </div>
    </div>

    <div class="form-group">
      <label>Reason for Leave</label>
      <textarea id="reason" placeholder="Karan likhein (e.g. Tabiyat kharab hai)..."></textarea>
    </div>

    <button class="btn-submit" onclick="submitLeave()">Submit Application</button>
  </div>

  <div class="footer-note">© Barsoi Public School • Secure Portal</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP0hgnV4f1Gjlwrp5X6NoPQJc1Eb6OlcIbRM1FaFPcDYHwnJmK5oAsXCGnryx3HVN3/exec";

  // Helper Function for DD/MM/YYYY
  function formatDateDDMMYYYY(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    return `${day}/${month}/${year}`;
  }

  function submitLeave() {
    const className = document.getElementById("className").value.trim();
    const rollNo = document.getElementById("rollNo").value.trim();
    const studentName = document.getElementById("studentName").value.trim();
    const fromDate = document.getElementById("fromDate").value;
    const toDate = document.getElementById("toDate").value;
    const reason = document.getElementById("reason").value.trim();

    if (!className || !rollNo || !studentName || !fromDate || !toDate || !reason) {
      Swal.fire('Adhoori Jankari', 'Kripya sabhi fields bharein!', 'warning');
      return;
    }

    Swal.fire({ title: 'Submitting...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

    const params = new URLSearchParams({
      action: "applyLeave",
      className: className,
      rollNo: rollNo,
      studentName: studentName,
      fromDate: fromDate,
      toDate: toDate,
      reason: reason
    });

    fetch(`${SCRIPT_URL}?${params.toString()}`)
      .then(res => res.json())
      .then(data => {
        Swal.close();
        if (data.status === "success") {
          Swal.fire('Success!', 'Leave application safalpurvak bhej di gayi hai.', 'success');
          document.getElementById("className").value = "";
          document.getElementById("rollNo").value = "";
          document.getElementById("studentName").value = "";
          document.getElementById("fromDate").value = "";
          document.getElementById("toDate").value = "";
          document.getElementById("reason").value = "";
        } else {
          Swal.fire('Error', 'Kuch gadbadi ho gayi.', 'error');
        }
      })
      .catch(err => {
        Swal.close();
        Swal.fire('Error', 'Server connection failed!', 'error');
      });
  }

  // Student Status Check Function
  function checkLeaveStatus() {
    const className = document.getElementById("className").value.trim();
    const rollNo = document.getElementById("rollNo").value.trim();
    const studentName = document.getElementById("studentName").value.trim();

    if (!className || !rollNo || !studentName) {
      Swal.fire('Jankari Chahiye', 'Status check karne ke liye Class, Roll No aur Student Name bharein!', 'info');
      return;
    }

    Swal.fire({ title: 'Checking status...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

    const params = new URLSearchParams({
      action: "checkStatus",
      className: className,
      rollNo: rollNo,
      studentName: studentName
    });

    fetch(`${SCRIPT_URL}?${params.toString()}`)
      .then(res => res.json())
      .then(data => {
        Swal.close();
        if (data.status === "success") {
          let statusColor = '#d97706'; // Pending
          if (data.leaveStatus === 'Approved') statusColor = '#16a34a';
          if (data.leaveStatus === 'Rejected') statusColor = '#dc2626';

          let formattedFrom = formatDateDDMMYYYY(data.fromDate);
          let formattedTo = formatDateDDMMYYYY(data.toDate);

          // Admin Remark Section (Agar admin ne koi note/remark likha ho)
          let remarkHtml = data.remark ? `<br><b>Admin Remark:</b> <span style="color:#2563eb;">${data.remark}</span>` : '';

          Swal.fire({
            title: 'Application Status',
            html: `<b>Status:</b> <span style="color:${statusColor}; font-size:16px;">${data.leaveStatus}</span><br><br>
                   <small><b>Dates:</b> ${formattedFrom} to ${formattedTo}<br><b>Reason:</b> ${data.reason}${remarkHtml}</small>`,
            icon: data.leaveStatus === 'Approved' ? 'success' : (data.leaveStatus === 'Rejected' ? 'error' : 'info')
          });
        } else {
          Swal.fire('Not Found', 'Aapki koi leave application nahi mili. Kripya details check karein.', 'warning');
        }
      })
      .catch(err => {
        Swal.close();
        Swal.fire('Error', 'Server connection failed!', 'error');
      });
  }
</script>
</body>
</html>
